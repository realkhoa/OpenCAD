name: Build and Package OpenCAD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore OpenCAD.slnx

      - name: Build solution (Release)
        run: dotnet build OpenCAD.slnx -c Release --no-restore

      - name: Run Smoke Tests (Core)
        run: dotnet run --project tools/OpenCad.Tools -c Release --no-build -- smoke

      - name: Run Quality Verification Gates
        run: dotnet run --project tools/OpenCad.Tools -c Release --no-build -- checkall

      - name: Package Distributions (Portable & Standalone)
        shell: powershell
        run: .\tools\publish-release.ps1

      - name: Upload Zip Packages (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenCAD-v1.0.0-Windows-x64-Packages
          path: dist/releases/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone Exe (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenCAD-Standalone-win-x64
          path: dist/publish-win-x64-standalone/OpenCad.App.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'OpenCAD Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/releases/*.zip
            dist/publish-win-x64-standalone/OpenCad.App.exe
          generate_release_notes: true
